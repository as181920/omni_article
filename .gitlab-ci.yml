before_script:
  - pwd
  - |
    runtoo_ruby_version="$(tr -d '[:space:]' < .ruby-version)"
    runtoo_ruby_version="${runtoo_ruby_version#ruby-}"
    mise install
    mise install "ruby@${runtoo_ruby_version}"
    runtoo_mise_env="$(mise env --shell bash "ruby@${runtoo_ruby_version}")"
    eval "${runtoo_mise_env}"
  - ruby -v
  - bundle install -j $(nproc)

stages:
  - rubocop
  - test

rubocop:
  stage: rubocop
  when: always
  script:
    - bin/rails rubocop

test:
  stage: test
  script:
    - bundle install -j $(nproc)
    - ln -s /home/gitlab-runner/shared/configs/as_projects/omni_engines/omni_article/database.yml ./test/dummy/config/database.yml
    - bin/rails app:db:migrate:reset RAILS_ENV=test
    - bin/rails test
