before_script:
  - pwd
  - |
    runtoo_ruby_version="$(tr -d '[:space:]' < .ruby-version)"
    runtoo_ruby_version="${runtoo_ruby_version#ruby-}"
    mise install
    mise install "ruby@${runtoo_ruby_version}"
    runtoo_mise_env="$(mise env --shell bash "ruby@${runtoo_ruby_version}")"
    eval "${runtoo_mise_env}"
  - ruby -v
  - bundle install -j $(nproc)

  - git lfs install
  - git -C "$(bundle show ip_info)" read-tree HEAD
  - git -C "$(bundle show ip_info)" lfs pull --include=data/GeoLite2-City.mmdb
  - bundle exec ruby -rip_info -e 'puts "GeoIP database ready"'

stages:
  - verify

verify:
  stage: verify
  script:
    - ln -sfn /home/gitlab-runner/shared/configs/as_projects/omni_engines/omni_article/database.yml ./test/dummy/config/database.yml
    - bin/ci
